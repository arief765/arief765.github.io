<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Personal Message | Arief Lukman
    </title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar message-navbar">

        <div class="logo">
            Arief Lukman
        </div>

        <div class="nav-links">

            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                Portfolio
            </a>

        </div>

    </nav>


    <!-- PERSONAL MESSAGE -->

    <section class="message-page">

        <div class="container">

            <h2 class="section-title">
                Personal Message
            </h2>


            <!-- LOGIN -->

            <div
                class="card message-card"
                id="login-card">

                <h3>
                    <i class="fa-solid fa-lock"></i>
                    Admin Login
                </h3>

                <p>
                    Login untuk mengelola personal message.
                </p>


                <input
                    type="email"
                    id="login-email"
                    class="message-input"
                    placeholder="Email">


                <input
                    type="password"
                    id="login-password"
                    class="message-input"
                    placeholder="Password">


                <button
                    type="button"
                    class="btn btn-primary"
                    id="login-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>


                <p
                    id="login-status"
                    class="message-status">
                </p>

            </div>


            <!-- MESSAGE -->

            <div
                class="card message-card"
                id="message-card"
                style="display:none;">

                <div class="message-header">

                    <div>

                        <h3>
                            Personal Message
                        </h3>

                        <p id="logged-user"></p>

                    </div>

                    <button
                        type="button"
                        class="btn btn-danger"
                        id="logout-btn">

                        <i class="fa-solid fa-right-from-bracket"></i>

                        Logout

                    </button>

                </div>


                <textarea
                    id="message-text"
                    class="message-input"
                    rows="8"
                    placeholder="Tulis message di sini..."></textarea>


                <div class="message-actions">


                    <!-- SAVE -->

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="save-message-btn">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save

                    </button>


                    <!-- DELETE -->

                    <button
                        type="button"
                        class="btn btn-danger"
                        id="delete-message-btn">

                        <i class="fa-solid fa-trash"></i>

                        Delete

                    </button>


                    <!-- REFRESH -->

                    <button
                        type="button"
                        class="btn btn-outline"
                        onclick="refreshMessage()">

                        <i class="fa-solid fa-arrows-rotate"></i>

                        Refresh

                    </button>

                </div>


                <p
                    id="message-status"
                    class="message-status">
                </p>

            </div>

        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="message.js"></script>

</body>

</html>
